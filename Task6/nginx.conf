http {
    # 1. Объявляем зону для хранения состояний IP-адресов.
    # $binary_remote_addr — ключ (IP клиента в бинарном виде для экономии памяти).
    # zone=mylimit:10m — выделяем 10 МБ (хватит на ~160 000 IP-адресов).
    # rate=10r/m — устанавливаем лимит: 10 запросов в минуту.
    limit_req_zone $binary_remote_addr zone=mylimit:10m rate=10r/m;

    # Настройка upstream для балансировки нагрузки
    upstream backend_servers {
        server backend1.example.com;
        server backend2.example.com;
        server backend3.example.com;
    }

    server {
        listen 80;

        # 2. Указываем Nginx возвращать код 429 при превышении лимита (по умолчанию 503).
        limit_req_status 429;

        location / {
            # 3. Применяем ограничение к конкретной локации.
            # burst=5 — разрешает кратковременный "всплеск" из 5 запросов сверх лимита.
            # nodelay — заставляет Nginx обрабатывать burst-запросы мгновенно, не ставя их в очередь.
            limit_req zone=mylimit burst=5 nodelay;

            proxy_pass http://backend_servers;
        }
    }
}